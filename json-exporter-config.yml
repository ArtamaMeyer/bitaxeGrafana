modules:
  default:
    metrics:
    - name: axe_power
      path: "{.power}"
      type: value
      help: Power in W
      labels:
        hostname: '{.hostname}'
    - name: axe_voltage
      path: "{.voltage}"
      type: value
      help: Voltage in V
      labels:
        hostname: '{.hostname}'
    - name: axe_asic_core_voltage_setting
      path: "{.coreVoltage}"
      type: value
      help: Core voltage setting in V
      labels:
        hostname: '{.hostname}'
    - name: axe_asic_core_voltage
      path: "{.coreVoltageActual}"
      type: value
      help: Actual Core voltage in V
      labels:
        hostname: '{.hostname}'
    - name: axe_current
      path: "{.current}"
      type: value
      help: Current in mA
      labels:
        hostname: '{.hostname}'
    - name: axe_fan_speed_rpm
      path: "{.fanrpm}"
      type: value
      help: Fan speed in RPM
      labels:
        hostname: '{.hostname}'
    - name: axe_fan2_speed_rpm
      path: "{.fan2rpm}"
      type: value
      help: Secondary fan speed in RPM
      labels:
        hostname: '{.hostname}'
    - name: axe_fan_speed_percent
      path: "{.fanspeed}"
      type: value
      help: Fan speed in percentage
      labels:
        hostname: '{.hostname}'
    - name: axe_temp
      path: "{.temp}"
      type: value
      help: Average chip temperature in Celsius
      labels:
        hostname: '{.hostname}'
    - name: axe_temp2
      path: "{.temp2}"
      type: value
      help: Average chip temperature from second sensor in Celsius
      labels:
        hostname: '{.hostname}'
    - name: axe_hash_rate
      path: "{.hashRate}"
      type: value
      help: Current hash rate in GH/s
      labels:
        hostname: '{.hostname}'
    - name: axe_hash_rate_1m
      path: "{.hashRate_1m}"
      type: value
      help: Hash rate 1 minute average in GH/s
      labels:
        hostname: '{.hostname}'
    - name: axe_hash_rate_10m
      path: "{.hashRate_10m}"
      type: value
      help: Hash rate 10 minute average in GH/s
      labels:
        hostname: '{.hostname}'
    - name: axe_hash_rate_1h
      path: "{.hashRate_1h}"
      type: value
      help: Hash rate 1 hour average in GH/s
      labels:
        hostname: '{.hostname}'
    - name: axe_expected_hashrate
      path: "{.expectedHashrate}"
      type: value
      help: Expected hashrate at current voltage/frequency settings in GH/s
      labels:
        hostname: '{.hostname}'
    - name: axe_error_percentage
      path: "{.errorPercentage}"
      type: value
      help: Hash error percentage
      labels:
        hostname: '{.hostname}'
    - name: axe_frequency
      path: "{.frequency}"
      type: value
      help: ASIC frequency
      labels:
        hostname: '{.hostname}'
    - name: axe_shares_accepted
      path: "{.sharesAccepted}"
      type: value
      help: Shares accepted
      labels:
        hostname: '{.hostname}'
    - name: axe_shares_rejected
      path: "{.sharesRejected}"
      type: value
      help: Shares rejected
      labels:
        hostname: '{.hostname}'
    - name: axe_uptime
      path: "{.uptimeSeconds}"
      type: value
      help: Uptime in seconds
      labels:
        hostname: '{.hostname}'
    - name: axe_vr_temp
      path: "{.vrTemp}"
      type: value
      help: Voltage regulator temperature in Celsius
      labels:
        hostname: '{.hostname}'
    - name: axe_free_heap
      path: "{.freeHeap}"
      type: value
      help: Free heap memory in Bytes
      labels:
        hostname: '{.hostname}'
    - name: axe_free_heap_internal
      path: "{.freeHeapInternal}"
      type: value
      help: Free internal heap memory in Bytes
      labels:
        hostname: '{.hostname}'
    - name: axe_free_heap_spiram
      path: "{.freeHeapSpiram}"
      type: value
      help: Free SPIRAM heap memory in Bytes
      labels:
        hostname: '{.hostname}'
    - name: axe_overheat_mode
      path: "{.overheat_mode}"
      type: value
      help: Overheated false/true
      labels:
        hostname: '{.hostname}'
    - name: axe_best_difficulty
      path: "1"
      type: value
      help: Best difficulty
      labels:
        hostname: '{.hostname}'
        difficulty: '{.bestDiff}'
    - name: axe_best_session_difficulty
      path: "1"
      type: value
      help: Best difficulty since boot
      labels:
        hostname: '{.hostname}'
        difficulty: '{.bestSessionDiff}'
    - name: axe_stratum_url
      path: "1"
      type: value
      help: Stratum URL
      labels:
        hostname: '{.hostname}'
        stratum_url: '{.stratumURL}'
    - name: axe_wifi_status
      path: "1"
      type: value
      help: WiFi connection status
      labels:
        hostname: '{.hostname}'
        wifi_status: '{.wifiStatus}'
    - name: axe_wifi_rssi
      path: "{.wifiRSSI}"
      type: value
      help: WiFi signal strength in dBm
      labels:
        hostname: '{.hostname}'
    - name: axe_pool_difficulty
      path: "{.poolDifficulty}"
      type: value
      help: Current pool difficulty
      labels:
        hostname: '{.hostname}'
    - name: axe_response_time
      path: "{.responseTime}"
      type: value
      help: Pool response time in milliseconds
      labels:
        hostname: '{.hostname}'
    - name: axe_block_height
      path: "{.blockHeight}"
      type: value
      help: Current block height
      labels:
        hostname: '{.hostname}'
    - name: axe_network_difficulty
      path: "{.networkDifficulty}"
      type: value
      help: Current network difficulty
      labels:
        hostname: '{.hostname}'
    - name: axe_block_found
      path: "{.blockFound}"
      type: value
      help: Whether a block was found (0=no, 1=yes)
      labels:
        hostname: '{.hostname}'
    - name: axe_ipv4
      path: "1"
      type: value
      help: IPv4 address
      labels:
        hostname: '{.hostname}'
        ipv4: '{.ipv4}'
    - name: axe_ipv6
      path: "1"
      type: value
      help: IPv6 address
      labels:
        hostname: '{.hostname}'
        ipv6: '{.ipv6}'
